<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>IT PMO Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: metallic monochrome project board. Brushed-steel app bar with progress, filter row, four status columns; cards carry priority, owner, due date. */
:root {
  --bg: #e4e7ea; --surface: #fbfcfc; --col: #d6dadf; --ink: #14171a; --muted: #4f5760; --line: #b9bfc6;
  --primary: #2a3036; --primary-ink: #f4f6f8; --primary-soft: #e3e6ea; --bar: #14171a; --bar-ink: #f1f3f5;
  --accent: #5b636d; --accent-soft: #e3e6ea;
  --crit: #9f1f1f; --crit-bg: #f3dede; --high: #14171a; --high-bg: #c9cfd6; --med: #3b434b; --med-bg: #dde1e6; --low: #59616a; --low-bg: #eceef1;
  --focus: #14171a; --shadow: 0 1px 2px rgba(20,23,26,.18);
  --m-bar: linear-gradient(180deg,#363c43 0%,#1b1f23 48%,#101215 100%);
  --m-btn: linear-gradient(180deg,#4a525b 0%,#2a3036 50%,#1a1e22 100%);
  --m-card: linear-gradient(180deg,#ffffff 0%,#f0f2f4 100%);
  --m-col: linear-gradient(180deg,#dfe3e7 0%,#cfd4da 100%);
  --m-shine: inset 0 1px 0 rgba(255,255,255,.75);
  --r1: #14171a; --r2: #4a525b; --r3: #8b939c; --r4: #c3c8ce; --bar-mark: linear-gradient(180deg,#59616a,#2a3036);
  --display: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c0e10; --surface: #1b1f23; --col: #131619; --ink: #e8ebee; --muted: #9aa2ab; --line: #343a41;
  --primary: #d3d8de; --primary-ink: #101214; --primary-soft: #2a3036; --bar: #16191c; --bar-ink: #eceff2;
  --accent: #a9b1ba; --accent-soft: #2a3036;
  --crit: #ff9a9a; --crit-bg: #3a1c1c; --high: #101214; --high-bg: #c3c9d0; --med: #d3d8de; --med-bg: #2f353b; --low: #aeb6be; --low-bg: #23282d;
  --focus: #eceff2; --shadow: none;
  --m-bar: linear-gradient(180deg,#2e343a 0%,#171a1d 50%,#0d0f11 100%);
  --m-btn: linear-gradient(180deg,#eef1f4 0%,#c3c9d0 50%,#9aa2ab 100%);
  --m-card: linear-gradient(180deg,#22272c 0%,#181b1f 100%);
  --m-col: linear-gradient(180deg,#14171a 0%,#0f1113 100%);
  --m-shine: inset 0 1px 0 rgba(255,255,255,.08);
  --r1: #f1f3f5; --r2: #c3c9d0; --r3: #8b939c; --r4: #4f565e; --bar-mark: linear-gradient(180deg,#eef1f4,#9aa2ab);
  --r1: #f1f3f5; --r2: #c3c9d0; --r3: #8b939c; --r4: #4f565e; --bar-mark: linear-gradient(180deg,#eef1f4,#9aa2ab);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0c0e10; --surface: #1b1f23; --col: #131619; --ink: #e8ebee; --muted: #9aa2ab; --line: #343a41;
  --primary: #d3d8de; --primary-ink: #101214; --primary-soft: #2a3036; --bar: #16191c; --bar-ink: #eceff2;
  --accent: #a9b1ba; --accent-soft: #2a3036;
  --crit: #ff9a9a; --crit-bg: #3a1c1c; --high: #101214; --high-bg: #c3c9d0; --med: #d3d8de; --med-bg: #2f353b; --low: #aeb6be; --low-bg: #23282d;
  --focus: #eceff2; --shadow: none;
  --m-bar: linear-gradient(180deg,#2e343a 0%,#171a1d 50%,#0d0f11 100%);
  --m-btn: linear-gradient(180deg,#eef1f4 0%,#c3c9d0 50%,#9aa2ab 100%);
  --m-card: linear-gradient(180deg,#22272c 0%,#181b1f 100%);
  --m-col: linear-gradient(180deg,#14171a 0%,#0f1113 100%);
  --m-shine: inset 0 1px 0 rgba(255,255,255,.08);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; font-family: var(--display); color: var(--ink); background: var(--bg); line-height: 1.5; font-size: 15px; }
button, input, select, textarea { font: inherit; color: inherit; }
button, select, [draggable] { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* App bar */
.app-header { background: var(--m-bar); box-shadow: inset 0 -1px 0 rgba(255,255,255,.12), inset 0 1px 0 rgba(255,255,255,.18); color: var(--bar-ink); padding-block: var(--s4); }
.bar-row { display: flex; flex-wrap: wrap; gap: var(--s4); align-items: center; justify-content: space-between; }
.wordmark { font-size: 1.35rem; font-weight: 800; margin: 0; letter-spacing: -.01em; }
.wordmark span { font-weight: 500; opacity: .75; font-size: .9rem; margin-left: var(--s2); }
.btn { display: inline-flex; align-items: center; gap: var(--s2); justify-content: center; min-height: 44px; border: 1px solid transparent; border-radius: var(--radius); padding: 0 var(--s4); font-weight: 700; transition: background-color .15s, border-color .15s, color .15s; }
.btn-primary { background: var(--m-btn); color: var(--primary-ink); border-color: rgba(255,255,255,.25); box-shadow: var(--m-shine); }
.btn-primary:hover { filter: brightness(1.1); }
.btn-primary:disabled { opacity: .65; cursor: progress; }
.btn-ghost { background: var(--m-card); box-shadow: var(--m-shine); border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { border-color: var(--ink); }
.progress { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s4); font-size: .85rem; }
.progress-track { flex: 1; height: 8px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: linear-gradient(180deg,#f4f6f8,#9aa2ab); border-radius: 99px; transition: width .3s ease; }
#progressText { font-weight: 700; min-width: 7.5em; text-align: right; font-variant-numeric: tabular-nums; }
.summary { display: flex; flex-wrap: wrap; gap: var(--s2); list-style: none; margin: var(--s4) 0 0; padding: 0; }
.summary li { box-shadow: inset 0 1px 0 rgba(255,255,255,.14); display: flex; align-items: baseline; gap: var(--s2); background: rgba(255,255,255,.1); border-radius: var(--radius); padding: var(--s1) var(--s3); font-size: .82rem; }
.summary strong { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.summary .is-overdue { background: #8f1d1d; color: #fff; }

/* Filters */
.filters { background: var(--surface); border-bottom: 1px solid var(--line); padding-block: var(--s3); display: flex; flex-wrap: wrap; gap: var(--s3); align-items: end; }
.filters label { display: block; font-size: .75rem; font-weight: 700; color: var(--muted); margin-bottom: var(--s1); letter-spacing: .04em; text-transform: uppercase; }
.filters select, .filters input, .field input, .field select, .field textarea { min-height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 0 var(--s3); background: var(--surface); }
.filters select, .filters input { min-width: 170px; }
.field textarea { padding: var(--s3); }
.note { margin: 0 0 0 auto; font-size: .78rem; color: var(--muted); max-width: 30ch; }

/* Charts */
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); padding-top: var(--s5); }
.chart { background: var(--m-card); box-shadow: var(--m-shine), var(--shadow); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s4); min-width: 0; }
.chart h2 { margin: 0 0 var(--s1); font-size: .95rem; font-weight: 800; }
.chart .sub { margin: 0 0 var(--s3); font-size: .78rem; color: var(--muted); }
.bars { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) 2.2rem; gap: var(--s2) var(--s3); align-items: center; margin: 0; padding: 0; list-style: none; }
.bars li { display: contents; }
.bar-label { font-size: .8rem; overflow-wrap: anywhere; }
.bar-track { height: 18px; display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
.bar-seg { height: 100%; min-width: 0; border-radius: 0 4px 4px 0; }
.bar-seg:first-child { border-radius: 0 4px 4px 0; }
.bar-seg.solo { background: var(--bar-mark); }
.bar-seg:hover { outline: 2px solid var(--focus); outline-offset: 1px; }
.bar-val { font-size: .82rem; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); margin: var(--s3) 0 0; padding: 0; list-style: none; font-size: .78rem; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: var(--s2); }
.swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); }
.chart-empty { font-size: .85rem; color: var(--muted); margin: 0; }

/* Board */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s4); padding-block: var(--s5); align-items: start; }
.column { background: var(--m-col); box-shadow: inset 0 1px 3px rgba(0,0,0,.12); border: 2px solid transparent; border-radius: var(--radius); padding: var(--s3); min-height: 240px; transition: background-color .15s, border-color .15s; }
.column.drop-target { background: var(--primary-soft); border-color: var(--primary); border-style: dashed; }
.column-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--s3); }
.column-head h2 { display: flex; align-items: center; gap: var(--s2); margin: 0; font-size: .95rem; font-weight: 800; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.dot { box-shadow: inset 0 1px 1px rgba(255,255,255,.5); } .dot-in-progress { background: var(--ink); } .dot-blocked { background: var(--crit); } .dot-done { background: var(--low); }
.count { background: var(--m-card); box-shadow: var(--m-shine); border: 1px solid var(--line); border-radius: 99px; padding: 0 10px; font-size: .8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: .85rem; text-align: center; padding: var(--s5) var(--s3); margin: 0; border: 1px dashed var(--line); border-radius: 8px; }
.cards { display: flex; flex-direction: column; gap: var(--s3); }

/* Cards */
.card { background: var(--m-card); box-shadow: var(--m-shine), var(--shadow); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s3) var(--s4); transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--primary); }
.card.dragging { opacity: .4; }
.card-top { display: flex; justify-content: space-between; gap: var(--s2); align-items: center; }
.task-id { font-size: .72rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.card h3 { margin: var(--s2) 0 var(--s1); font-size: .95rem; line-height: 1.35; overflow-wrap: anywhere; }
.meta { font-size: .78rem; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
.badges { display: flex; flex-wrap: wrap; gap: var(--s1); margin: var(--s2) 0; }
.pill, .tag, .badge-overdue { font-size: .7rem; font-weight: 700; border-radius: 99px; padding: 2px 10px; }
.pill-critical { background: var(--crit-bg); color: var(--crit); } .pill-high { background: var(--high-bg); color: var(--high); box-shadow: var(--m-shine); }
.pill-medium { background: var(--med-bg); color: var(--med); } .pill-low { background: var(--low-bg); color: var(--low); }
.tag { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 600; }
.badge-overdue { background: var(--crit-bg); color: var(--crit); }
.card-foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); font-size: .78rem; color: var(--muted); }
.avatar { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-size: .65rem; font-weight: 800; }
.who { min-width: 0; overflow-wrap: anywhere; }
.due { margin-left: auto; display: inline-flex; align-items: center; gap: var(--s1); }
.due.late { color: var(--crit); font-weight: 700; }
.card-actions { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); margin-top: var(--s3); padding-top: var(--s2); border-top: 1px solid var(--line); }
.card-actions select { min-height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 0 var(--s2); font-size: .8rem; background: var(--surface); max-width: 70%; }
.icon-btn { display: inline-grid; place-items: center; background: transparent; border: 1px solid transparent; border-radius: 8px; width: 44px; height: 44px; color: var(--muted); font-size: 1.4rem; line-height: 1; transition: background-color .15s, color .15s; }
.icon-btn:hover { color: var(--crit); background: var(--crit-bg); }
.confirm { display: flex; align-items: center; gap: var(--s2); font-size: .82rem; font-weight: 700; color: var(--crit); }
.confirm button { min-height: 44px; min-width: 56px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 var(--s3); font-size: .82rem; font-weight: 700; }
.confirm .yes { background: var(--crit); color: #fff; border-color: var(--crit); }

/* Modal */
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(580px, 94vw); background: var(--surface); color: var(--ink); box-shadow: 0 12px 40px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(5, 20, 20, .6); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: var(--s3) var(--s3) var(--s3) var(--s5); border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-size: 1.1rem; }
form { padding: var(--s4) var(--s5) var(--s5); display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3) var(--s4); max-height: 80vh; overflow: auto; }
.field { display: flex; flex-direction: column; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: .8rem; font-weight: 700; margin-bottom: var(--s1); }
.field textarea { min-height: 88px; resize: vertical; }
.field .error { color: var(--crit); font-size: .78rem; min-height: 1.2em; margin-top: 2px; }
.field [aria-invalid="true"] { border-color: var(--crit); background: var(--crit-bg); }
.form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: var(--s2); }

/* Toasts */
.toasts { position: fixed; right: max(var(--s4), env(safe-area-inset-right, 0px)); bottom: max(var(--s4), env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: var(--s2); z-index: 50; max-width: min(380px, 92vw); }
.toast { background: var(--m-bar); color: var(--bar-ink); padding: var(--s3) var(--s4); border-radius: var(--radius); font-size: .88rem; border-left: 4px solid var(--primary); box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.toast.warn { border-left-color: var(--crit); }

@media (max-width: 1100px) { .charts { grid-template-columns: 1fr; } .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) {
  .board { grid-template-columns: 1fr; }
  .bars { grid-template-columns: minmax(0, 7rem) minmax(0, 1fr) 2rem; }
  .column { min-height: 0; }
  .filters > div { flex: 1 1 140px; } .filters select, .filters input { width: 100%; min-width: 0; }
  .note { margin-left: 0; max-width: none; }
  form { grid-template-columns: 1fr; }
  #progressText { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="app-header"><div class="wrap">
  <div class="bar-row">
    <h1 class="wordmark">IT PMO<span>Project Board (demo)</span></h1>
    <button type="button" class="btn btn-primary" id="openForm"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add task</button>
  </div>
  <div class="progress"><div class="progress-track" id="progressBar" role="progressbar" aria-label="Tasks done" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div><span id="progressText">0% complete</span></div>
  <ul class="summary" id="summary" aria-label="Board summary"></ul>
</div></header>

<section class="filters wrap" aria-label="Filters">
  <div><label for="fProject">Project</label><select id="fProject"><option value="">All projects</option></select></div>
  <div><label for="fAssignee">Assignee</label><input id="fAssignee" type="text" placeholder="e.g. Tan"></div>
  <div><label for="fPriority">Priority</label><select id="fPriority"><option value="">All priorities</option></select></div>
  <button type="button" class="btn btn-ghost" id="clearFilters">Clear</button>
  <p class="note">Demo data lives in memory only. Refreshing resets the board.</p>
</section>

<section class="charts wrap" aria-label="Charts">
  <figure class="chart" style="margin-inline:0"><h2>Tasks by status</h2><p class="sub" id="statusSub"></p><ul class="bars" id="statusBars"></ul></figure>
  <figure class="chart" style="margin-inline:0"><h2>Workload by project</h2><p class="sub">Tasks per project, split by priority</p><ul class="bars" id="projectBars"></ul>
    <ul class="legend" aria-label="Priority legend"><li><span class="swatch" style="background:var(--r1)"></span>Critical</li><li><span class="swatch" style="background:var(--r2)"></span>High</li><li><span class="swatch" style="background:var(--r3)"></span>Medium</li><li><span class="swatch" style="background:var(--r4)"></span>Low</li></ul></figure>
</section>

<main class="board wrap" id="board" aria-label="Kanban board"></main>
<!-- ===== Add Task modal ===== -->
<dialog id="taskDialog" aria-labelledby="dlgTitle">
  <div class="modal-head">
    <h2 id="dlgTitle">Add Task</h2>
    <button type="button" class="icon-btn" id="closeForm" aria-label="Close add task form">×</button>
  </div>
  <form id="taskForm" novalidate>
    <div class="field full">
      <label for="title">Task Title *</label>
      <input id="title" name="title" type="text" maxlength="80" aria-describedby="err-title">
      <span class="error" id="err-title"></span>
    </div>
    <div class="field full">
      <label for="description">Description</label>
      <textarea id="description" name="description" maxlength="500" aria-describedby="err-description"></textarea>
      <span class="error" id="err-description"></span>
    </div>
    <div class="field">
      <label for="project">Project / Workstream *</label>
      <select id="project" name="project"></select>
      <span class="error" id="err-project"></span>
    </div>
    <div class="field">
      <label for="category">Category *</label>
      <select id="category" name="category"></select>
      <span class="error" id="err-category"></span>
    </div>
    <div class="field">
      <label for="assignee">Assignee *</label>
      <input id="assignee" name="assignee" type="text" maxlength="60" aria-describedby="err-assignee">
      <span class="error" id="err-assignee"></span>
    </div>
    <div class="field">
      <label for="priority">Priority *</label>
      <select id="priority" name="priority"></select>
      <span class="error" id="err-priority"></span>
    </div>
    <div class="field">
      <label for="dueDate">Due Date *</label>
      <input id="dueDate" name="dueDate" type="date" aria-describedby="err-dueDate">
      <span class="error" id="err-dueDate"></span>
    </div>
    <div class="field">
      <label for="status">Status *</label>
      <select id="status" name="status"></select>
      <span class="error" id="err-status"></span>
    </div>
    <div class="form-actions">
      <button type="button" class="btn btn-ghost" id="cancelForm">Cancel</button>
      <button type="submit" class="btn btn-primary" id="submitBtn">Add Task</button>
    </div>
  </form>
</dialog>

<!-- ===== Toast region (screen-reader friendly) ===== -->
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<!--
  FORMSUBMIT ACTIVATION (one-time): FormSubmit requires the destination address
  to be confirmed. The FIRST submission sent to FORMSUBMIT_ENDPOINT triggers a
  confirmation email to that address. Submissions only start being delivered
  after the activation link in that email has been clicked.
-->
<script>
"use strict";

/* =====================================================================
   CONFIG — change the email address here (the ONLY place it appears).
   ===================================================================== */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";
const NOTIFY_ENABLED = FORMSUBMIT_ENDPOINT.indexOf("YOUR_EMAIL") === -1;

/* ===== Reference data ===== */
const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
const PROJECTS = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];
const CATEGORIES = ["Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];

/* ===== Single source of truth (in-memory only; no storage APIs) ===== */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  confirmDeleteId: null, // task id currently showing the inline "Delete? Yes / No"
  draggingId: null,
  nextId: 1,
  focusAfterRender: null // selector to refocus after a re-render
};

const ICON_CAL = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>';

/* ===== Helpers ===== */
function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function pad(n) { return String(n).padStart(2, "0"); }
function isoToday() { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function isoOffset(days) { const d = new Date(); d.setDate(d.getDate() + days); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function formatDate(iso) {
  const p = iso.split("-");
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return Number(p[2]) + " " + months[Number(p[1]) - 1] + " " + p[0];
}
function isOverdue(task) { return task.status !== "Done" && task.dueDate < isoToday(); }
function slug(s) { return s.toLowerCase(); }
function formatId(n) { return "PMO-" + String(n).padStart(4, "0"); }

/* ===== Seed data (dates relative to today so overdue demo always works) ===== */
function seedTasks() {
  const seed = [
    ["Migrate FX pricing service to AWS", "Lift-and-shift the FX pricing microservices to the approved cloud landing zone.", "Infrastructure & Cloud", "Infrastructure", "Priya Nair", "High", 21, "In Progress"],
    ["Patch CVE-2025-XXXX on branch teller VDI", "Roll out vendor patch to all branch teller VDI golden images.", "Cybersecurity Uplift", "Cybersecurity", "Daniel Tan", "Critical", -3, "In Progress"],
    ["UAT sign-off for mobile onboarding release 4.2", "Collect business sign-off for the digital onboarding flow.", "Digital Channels", "Application Development", "Aisha Rahman", "High", 5, "Blocked"],
    ["Core ledger upgrade – SIT environment build", "Provision SIT and load masked test data.", "Core Banking Upgrade", "Infrastructure", "Marcus Lim", "Medium", 30, "Backlog"],
    ["Regulatory reporting data lineage mapping", "Document lineage for MAS regulatory returns.", "Data & Analytics", "Compliance", "Chen Wei", "Medium", 45, "Backlog"],
    ["Renew SWIFT connectivity vendor contract", "Negotiate renewal and SLA changes with the vendor.", "Vendor Management", "Vendor", "Sofia Gomez", "Low", -6, "Backlog"],
    ["Decommission legacy loan origination servers", "Archive data and power down end-of-life servers.", "Infrastructure & Cloud", "Infrastructure", "Ravi Kumar", "Low", -14, "Done"],
    ["Quarterly access recertification – privileged accounts", "Complete the Q4 privileged access review.", "Cybersecurity Uplift", "Compliance", "Hannah Ooi", "High", 12, "Done"]
  ];
  seed.forEach(function (s) {
    state.tasks.push({
      id: formatId(state.nextId++), title: s[0], description: s[1], project: s[2], category: s[3],
      assignee: s[4], priority: s[5], dueDate: isoOffset(s[6]), status: s[7]
    });
  });
}

/* ===== Filtering (pure, client-side over state.tasks) ===== */
function applyFilters(tasks) {
  const f = state.filters;
  const needle = f.assignee.trim().toLowerCase();
  return tasks.filter(function (t) {
    return (!f.project || t.project === f.project) &&
           (!f.priority || t.priority === f.priority) &&
           (!needle || t.assignee.toLowerCase().indexOf(needle) !== -1);
  });
}

/* ===== Rendering ===== */
function renderSummary() {
  const total = state.tasks.length;
  const overdue = state.tasks.filter(isOverdue).length;
  const done = state.tasks.filter(function (t) { return t.status === "Done"; }).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  let html = '<li><strong>' + total + '</strong><span>Total</span></li>';
  STATUSES.forEach(function (s) {
    html += '<li><strong>' + state.tasks.filter(function (t) { return t.status === s; }).length + '</strong><span>' + escapeHtml(s) + '</span></li>';
  });
  html += '<li class="' + (overdue ? 'is-overdue' : '') + '"><strong>' + overdue + '</strong><span>Overdue</span></li>';
  document.getElementById("summary").innerHTML = html;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = pct + "% complete";
  document.getElementById("progressBar").setAttribute("aria-valuenow", pct);
}

function initials(name) {
  return name.trim().split(/\s+/).slice(0, 2).map(function (p) { return p.charAt(0).toUpperCase(); }).join("");
}

function renderCard(task) {
  const confirming = state.confirmDeleteId === task.id;
  const moveOptions = '<option value="">Move ▸</option>' + STATUSES
    .filter(function (s) { return s !== task.status; })
    .map(function (s) { return '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>'; }).join("");
  const actions = confirming
    ? '<div class="confirm" role="group" aria-label="Confirm delete ' + escapeHtml(task.id) + '">Delete? ' +
        '<button type="button" class="yes" data-action="delete-yes" data-id="' + escapeHtml(task.id) + '">Yes</button>' +
        '<button type="button" data-action="delete-no" data-id="' + escapeHtml(task.id) + '">No</button></div>'
    : '<select data-action="move" data-id="' + escapeHtml(task.id) + '" aria-label="Move ' + escapeHtml(task.id) + ' to another column">' + moveOptions + '</select>' +
      '<button type="button" class="icon-btn" data-action="delete-ask" data-id="' + escapeHtml(task.id) + '" aria-label="Delete task ' + escapeHtml(task.id) + '">' + ICON_TRASH + '</button>';
  return '<article class="card p-' + slug(task.priority) + '" draggable="true" data-id="' + escapeHtml(task.id) + '">' +
    '<div class="card-top"><span class="task-id">' + escapeHtml(task.id) + '</span>' +
      '<span class="pill pill-' + slug(task.priority) + '">' + escapeHtml(task.priority) + '</span></div>' +
    '<h3>' + escapeHtml(task.title) + '</h3>' +
    '<p class="meta">' + escapeHtml(task.project) + '</p>' +
    '<div class="badges">' +
      '<span class="tag">' + escapeHtml(task.category) + '</span>' +
      (isOverdue(task) ? '<span class="badge-overdue">Overdue</span>' : '') +
    '</div>' +
    '<div class="card-foot"><span class="avatar" aria-hidden="true">' + escapeHtml(initials(task.assignee)) + '</span>' +
      '<span class="who">' + escapeHtml(task.assignee) + '</span>' +
      '<span class="due' + (isOverdue(task) ? ' late' : '') + '">' + ICON_CAL + 'Due ' + escapeHtml(formatDate(task.dueDate)) + '</span></div>' +
    '<div class="card-actions">' + actions + '</div>' +
  '</article>';
}

const RAMP = { Critical: "var(--r1)", High: "var(--r2)", Medium: "var(--r3)", Low: "var(--r4)" };
function renderCharts(visible) {
  const max = Math.max(1, ...STATUSES.map(function (s) { return visible.filter(function (t) { return t.status === s; }).length; }));
  document.getElementById("statusSub").textContent = visible.length + " task" + (visible.length === 1 ? "" : "s") + (visible.length === state.tasks.length ? " on the board" : " match the filters");
  document.getElementById("statusBars").innerHTML = STATUSES.map(function (s) {
    const n = visible.filter(function (t) { return t.status === s; }).length;
    return '<li><span class="bar-label">' + escapeHtml(s) + '</span><span class="bar-track"><span class="bar-seg solo" style="width:' + (n / max * 100) + '%" title="' + escapeHtml(s) + ': ' + n + '"></span></span><span class="bar-val">' + n + '</span></li>';
  }).join("");
  const rows = PROJECTS.map(function (p) { return { p: p, items: visible.filter(function (t) { return t.project === p; }) }; }).filter(function (r) { return r.items.length; });
  const pmax = Math.max(1, ...rows.map(function (r) { return r.items.length; }));
  document.getElementById("projectBars").innerHTML = rows.length ? rows.map(function (r) {
    const segs = PRIORITIES.map(function (pr) {
      const n = r.items.filter(function (t) { return t.priority === pr; }).length;
      return n ? '<span class="bar-seg" style="width:' + (n / pmax * 100) + '%;background:' + RAMP[pr] + '" title="' + escapeHtml(r.p) + ' · ' + pr + ': ' + n + '"></span>' : "";
    }).join("");
    return '<li><span class="bar-label">' + escapeHtml(r.p) + '</span><span class="bar-track">' + segs + '</span><span class="bar-val">' + r.items.length + '</span></li>';
  }).join("") : '<li><p class="chart-empty">No tasks match the filters.</p></li>';
}

function renderBoard() {
  const visible = applyFilters(state.tasks);
  const board = document.getElementById("board");
  board.innerHTML = STATUSES.map(function (status) {
    const items = visible.filter(function (t) { return t.status === status; });
    return '<section class="column" data-status="' + escapeHtml(status) + '" aria-label="' + escapeHtml(status) + ' column">' +
      '<div class="column-head"><h2><span class="dot dot-' + slug(status).replace(/\s+/g, '-') + '" aria-hidden="true"></span>' + escapeHtml(status) + '</h2>' +
      '<span class="count" aria-label="' + items.length + ' tasks">' + items.length + '</span></div>' +
      '<div class="cards">' + (items.length ? items.map(renderCard).join("") : '<p class="empty">Nothing here. Drag a card in or use Move.</p>') + '</div>' +
    '</section>';
  }).join("");
  renderSummary();
  renderCharts(visible);
  if (state.focusAfterRender) {
    const el = board.querySelector(state.focusAfterRender);
    if (el) el.focus();
    state.focusAfterRender = null;
  }
}

/* ===== State mutations ===== */
function addTask(data) {
  const task = Object.assign({ id: formatId(state.nextId++) }, data);
  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, newStatus) {
  const task = state.tasks.find(function (t) { return t.id === id; });
  if (!task || STATUSES.indexOf(newStatus) === -1 || task.status === newStatus) return;
  task.status = newStatus;
  state.focusAfterRender = '.card[data-id="' + id + '"] select';
  renderBoard();
  showToast(id + " moved to " + newStatus);
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
  state.confirmDeleteId = null;
  renderBoard();
  showToast(id + " deleted");
}

/* ===== Toasts ===== */
function showToast(message, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind === "warn" ? " warn" : "");
  el.textContent = message;
  document.getElementById("toasts").appendChild(el);
  setTimeout(function () { el.remove(); }, kind === "warn" ? 6000 : 3500);
}

/* ===== FormSubmit notification (failure must never break the board) ===== */
async function notifyNewTask(task) {
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: `[IT PMO] New task ${task.id}: ${task.title}`,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString()
    })
  });
  if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  return res.json();
}

/* ===== Form: options, validation, submit ===== */
const form = document.getElementById("taskForm");
const dialog = document.getElementById("taskDialog");

function fillSelect(el, values, selected) {
  el.innerHTML = values.map(function (v) {
    return '<option value="' + escapeHtml(v) + '"' + (v === selected ? " selected" : "") + ">" + escapeHtml(v) + "</option>";
  }).join("");
}

function setError(field, message) {
  const input = form.elements[field];
  document.getElementById("err-" + field).textContent = message || "";
  if (message) input.setAttribute("aria-invalid", "true"); else input.removeAttribute("aria-invalid");
}

function validateForm() {
  const v = {
    title: form.elements.title.value.trim(),
    description: form.elements.description.value.trim(),
    project: form.elements.project.value,
    category: form.elements.category.value,
    assignee: form.elements.assignee.value.trim(),
    priority: form.elements.priority.value,
    dueDate: form.elements.dueDate.value,
    status: form.elements.status.value
  };
  const errors = {};
  if (!v.title) errors.title = "Task title is required.";
  else if (v.title.length > 80) errors.title = "Title must be 80 characters or fewer.";
  if (v.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
  if (PROJECTS.indexOf(v.project) === -1) errors.project = "Choose a project.";
  if (CATEGORIES.indexOf(v.category) === -1) errors.category = "Choose a category.";
  if (!v.assignee) errors.assignee = "Assignee is required.";
  if (PRIORITIES.indexOf(v.priority) === -1) errors.priority = "Choose a priority.";
  if (!v.dueDate) errors.dueDate = "Due date is required.";
  else if (v.dueDate < isoToday()) errors.dueDate = "Due date must not be in the past.";
  if (STATUSES.indexOf(v.status) === -1) errors.status = "Choose a status.";
  Object.keys(v).forEach(function (k) { setError(k, errors[k]); });
  const firstBad = Object.keys(errors)[0];
  if (firstBad) form.elements[firstBad].focus();
  return firstBad ? null : v;
}

function resetForm() {
  form.reset();
  fillSelect(form.elements.project, PROJECTS);
  fillSelect(form.elements.category, CATEGORIES);
  fillSelect(form.elements.priority, PRIORITIES, "Medium");
  fillSelect(form.elements.status, STATUSES, "Backlog");
  form.elements.dueDate.min = isoToday();
  ["title", "description", "project", "category", "assignee", "priority", "dueDate", "status"].forEach(function (k) { setError(k, ""); });
}

async function handleSubmit(event) {
  event.preventDefault();
  const data = validateForm();
  if (!data) return;
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Sending…";
  const task = addTask(data); // optimistic: card appears immediately
  showToast("Task " + task.id + " added to the board");
  try {
    if (NOTIFY_ENABLED) await notifyNewTask(task);
  } catch (err) {
    showToast("Card added locally — email notification failed", "warn");
  } finally {
    btn.disabled = false;
    btn.textContent = "Add Task";
    resetForm();
    dialog.close();
  }
}

function openForm() { resetForm(); dialog.showModal(); form.elements.title.focus(); }

/* ===== Event wiring ===== */
function wireEvents() {
  document.getElementById("openForm").addEventListener("click", openForm);
  document.getElementById("closeForm").addEventListener("click", function () { dialog.close(); });
  document.getElementById("cancelForm").addEventListener("click", function () { dialog.close(); });
  form.addEventListener("submit", handleSubmit);

  // Filters
  const fProject = document.getElementById("fProject");
  const fPriority = document.getElementById("fPriority");
  const fAssignee = document.getElementById("fAssignee");
  PROJECTS.forEach(function (p) { fProject.add(new Option(p, p)); });
  PRIORITIES.forEach(function (p) { fPriority.add(new Option(p, p)); });
  function syncFilters() {
    state.filters = { project: fProject.value, priority: fPriority.value, assignee: fAssignee.value };
    renderBoard();
  }
  fProject.addEventListener("change", syncFilters);
  fPriority.addEventListener("change", syncFilters);
  fAssignee.addEventListener("input", syncFilters);
  document.getElementById("clearFilters").addEventListener("click", function () {
    fProject.value = ""; fPriority.value = ""; fAssignee.value = "";
    syncFilters();
  });

  // Delegated card actions (click / change)
  const board = document.getElementById("board");
  board.addEventListener("click", function (e) {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === "delete-ask") { state.confirmDeleteId = id; state.focusAfterRender = '.card[data-id="' + id + '"] .yes'; renderBoard(); }
    else if (btn.dataset.action === "delete-no") { state.confirmDeleteId = null; state.focusAfterRender = '.card[data-id="' + id + '"] [data-action="delete-ask"]'; renderBoard(); }
    else if (btn.dataset.action === "delete-yes") deleteTask(id);
  });
  board.addEventListener("change", function (e) {
    const sel = e.target.closest('select[data-action="move"]');
    if (sel && sel.value) moveTask(sel.dataset.id, sel.value);
  });

  // Native HTML5 drag and drop
  board.addEventListener("dragstart", function (e) {
    const card = e.target.closest(".card");
    if (!card) return;
    state.draggingId = card.dataset.id;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", card.dataset.id);
    card.classList.add("dragging");
  });
  board.addEventListener("dragend", function () {
    state.draggingId = null;
    board.querySelectorAll(".dragging, .drop-target").forEach(function (el) { el.classList.remove("dragging", "drop-target"); });
  });
  board.addEventListener("dragover", function (e) {
    const col = e.target.closest(".column");
    if (!col || !state.draggingId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    board.querySelectorAll(".drop-target").forEach(function (el) { if (el !== col) el.classList.remove("drop-target"); });
    col.classList.add("drop-target");
  });
  board.addEventListener("dragleave", function (e) {
    const col = e.target.closest(".column");
    if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop-target");
  });
  board.addEventListener("drop", function (e) {
    const col = e.target.closest(".column");
    if (!col || !state.draggingId) return;
    e.preventDefault();
    const id = state.draggingId;
    state.draggingId = null;
    moveTask(id, col.dataset.status);
  });
}

/* ===== Init ===== */
seedTasks();
resetForm();
wireEvents();
renderBoard();
</script>
<script src=".claude/hooks/it-meeting-alert.js"></script>
<script src=".claude/hooks/it-assistant-chatbot.js"></script>
